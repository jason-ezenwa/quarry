name: Web CI

on:
  pull_request:
    paths:
      - apps/web/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/web.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/web.yml
  # Redeploys main by hand, such as after changing a VITE_* variable.
  workflow_dispatch:

# A newer push to the same PR replaces the run in progress.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Build, lint and test
    runs-on: ubuntu-latest
    env:
      # The web app never starts the server's in-memory MongoDB.
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Without it a deploy would ship a bundle that calls localhost.
      - if: github.event_name != 'pull_request'
        run: test -n "$VITE_API_URL" || { echo "Set the VITE_API_URL repository variable"; exit 1; }
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Vite inlines VITE_* values, so this is the build that gets deployed.
      - run: pnpm turbo run build --filter=web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WAITLIST_URL: ${{ vars.VITE_WAITLIST_URL }}

      - run: pnpm turbo run lint --filter=web --filter=@quarry/contracts

      - run: pnpm turbo run test --filter=web --filter=@quarry/contracts

      - run: pnpm turbo run test:integration --filter=web

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  deploy:
    name: Deploy web
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      # Through env, not inline, so a commit message can't inject shell.
      - name: Deploy to Cloudflare Pages
        run: |
          args=(--project-name=quarry --branch=main --commit-hash="$COMMIT_HASH" --commit-dirty=true)
          message="${COMMIT_MESSAGE%%$'\n'*}"
          if [ -n "$message" ]; then args+=(--commit-message="$message"); fi
          npx --yes wrangler@4.159.0 pages deploy dist "${args[@]}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_HASH: ${{ github.sha }}
          # Empty for a manual run, so it's left out.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
